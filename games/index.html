<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Games — Ajay Patel</title>
  <meta name="description" content="Little games I build for family and friends.">
  <meta name="theme-color" content="#0f1433">
  <style>
    :root { color-scheme: dark; --ink: #fff; --dim: rgba(255,255,255,.72); --glass: rgba(255,255,255,.14); --edge: rgba(255,255,255,.28); }
    html, body { min-height: 100%; margin: 0; }
    body { color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: radial-gradient(120% 60% at 70% 105%, #ff8a4c 0%, #d9466b 22%, rgba(90,40,120,0) 55%), linear-gradient(180deg, #0f1433 0%, #2b2160 45%, #6a2b6e 70%, #c2475e 100%) fixed; }
    main { max-width: 560px; margin: 0 auto; box-sizing: border-box;
      padding: calc(env(safe-area-inset-top, 0px) + 40px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 40px) max(20px, env(safe-area-inset-left, 0px)); }
    .back { color: var(--dim); text-decoration: none; font-weight: 600; font-size: 15px; }
    h1 { font-size: 34px; letter-spacing: -.02em; margin: 14px 0 4px; }
    .sub { color: var(--dim); margin: 0 0 24px; font-size: 16px; }
    .list { display: grid; gap: 12px; }
    .game { display: flex; align-items: center; gap: 16px; padding: 14px; border-radius: 22px; text-decoration: none; color: inherit;
      background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .game:active { transform: scale(.98); }
    .game img, .game .blank { width: 64px; height: 64px; border-radius: 15px; flex: none; }
    .game .blank { background: rgba(255,255,255,.1); border: 1px dashed var(--edge); box-sizing: border-box; }
    .game b { display: block; font-size: 18px; margin-bottom: 2px; }
    .game span { color: var(--dim); font-size: 14px; line-height: 1.35; }
    .game .go { margin-left: auto; color: var(--dim); font-size: 22px; }
    .soon { opacity: .6; pointer-events: none; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/">‹ Home</a>
    <h1>Games</h1>
    <p class="sub">Little games I build for family and friends. Free, no sign-up, and progress saves on your device.</p>
    <div class="list">
      <a class="game" href="word-vistas/">
        <img src="word-vistas/icon.png" alt="">
        <div><b>Word Vistas</b><span>Swipe letters to fill the crossword. 100 levels.</span></div>
        <div class="go" aria-hidden="true">›</div>
      </a>
      <div class="game soon" aria-hidden="true">
        <div class="blank"></div>
        <div><b>More soon</b><span>Next game in the works.</span></div>
      </div>
    </div>
  </main>
</body>
</html>
