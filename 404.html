<!DOCTYPE html>
<html lang="en">
<head>

      background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(20px); }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: rgba(255,255,255,.75); }
    a { display: inline-block; background: #0a84ff; color: #fff; text-decoration: none; font-weight: 600; padding: 12px 22px; border-radius: 24px; }

</head>

  <div>
